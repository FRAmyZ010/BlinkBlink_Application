<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlinkBlink</title>
    <link rel="stylesheet" href="\public\css\index.css" />
  </head>
  <body>
   

    <div class="container text-center">
      <div class="logo-container">
        <img src="./public/src/timer.png" alt="" class="timer-img">
        <h1 class="logo">BlinkBlink</h1>
      </div>

      <div class="header">
        <h1 id="dayoftheweek" class="dayoftheweek"></h1>
        <h1 id="date" class="date"></h1>
        <h2 id="time" class="time"></h2>
      </div>

      <div class="timer">
        <button  class="timer-btn btn-minus" onclick="subtractionTime(1)">-</button>
        <h1 id="timer" class="timer-display"></h1>
        <button class="timer-btn btn-plus" onclick="additionalTime(1)">+</button>
      </div>

      <div id="btn-sec" class="center">
        <button class="btn" id="start-btn">FOCUS</button>
        <button class="btn" id="stop-btn" hidden>STOP</button>
      </div>


    </div>
    
     <script src="\public\js\clock.js"></script>
     <script src="\public\js\timer.js"></script>
  </body>
</html>
